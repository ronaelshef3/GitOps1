replicaCount: 1

image:
  repository: my-app-image
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"

ingress:
  enabled: false

# Disable embedded Prometheus dependency to avoid port 9100 conflict
prometheus:
  enabled: false
  server:
    enabled: false
  alertmanager:
    enabled: false
  nodeExporter:
    enabled: false
  pushgateway:
    enabled: false

# Disable Redis metrics to avoid sidecar conflicts
redis:
  metrics:
    enabled: false