apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: universal-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: 25.x.x
    helm:
      values: |
        # English: Server configuration for low-resource environments (Docker/K3S)
        server:
          retention: 3h
          # Disable Persistent Volumes to work on both Docker (no PVC) and K3S (EBS/LocalPath)
          persistentVolume:
            enabled: false
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

        # English: Node Exporter setup that won't crash on port conflicts
        nodeExporter:
          enabled: true
          # hostNetwork: false ensures it works even if port 9100 is taken on the Host
          hostNetwork: false
          hostPID: false

        # English: Disable heavy Enterprise features
        alertmanager:
          enabled: false
        pushgateway:
          enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=false # English: Critical to bypass the "field not declared in schema" error