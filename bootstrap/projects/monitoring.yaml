apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # המקור הוא ה-Chart הרשמי של הקהילה
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x # גרסה יציבה
    helm:
      # כאן הקסם: אנחנו אומרים לו לקחת את ההגדרות מהגיט שלך
      valueFiles:
        - "https://github.com/ronaelshef3/GITops1/infrastructure/monitoring/values.yaml"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring # כדאי להפריד ל-Namespace משלו
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true # יצור את ה-Namespace 'monitoring' אוטומטית