apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: universal-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: 25.x.x
    helm:
      values: |
        server:
          persistentVolume:
            enabled: false
        nodeExporter:
          enabled: false
        alertmanager:
          enabled: false
        pushgateway:
          enabled: false
        kubeStateMetrics:
          enabled: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true