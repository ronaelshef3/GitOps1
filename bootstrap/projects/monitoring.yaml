apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x
    helm:
      values: |
        # Minimalist settings
        prometheus:
          prometheusSpec:
            replicas: 1
            storageSpec:
              emptyDir:
                medium: ""
        
        # Disable Alertmanager & Grafana (Optional: keep Grafana true if needed)
        alertmanager:
          enabled: false
        grafana:
          enabled: true

        # --- התיקון הקריטי לשגיאת ה-Secret ---
        prometheusOperator:
          enabled: true
          admissionWebhooks:
            enabled: false # מבטל את הצורך ב-Secret tls-secret
            patch:
              enabled: false
          tls:
            enabled: false
        
        # ביטול רכיבים שיוצרים עומס ודורשים Secrets נוספים
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /automountServiceAccountToken
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/automountServiceAccountToken

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Validate=false