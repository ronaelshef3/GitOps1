apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x
    helm:
      values: |
        # גרסה רזה מאוד ללוקאל
        prometheus:
          prometheusSpec:
            scrapeInterval: "30s"
            replicas: 1
            storageSpec:
              emptyDir:
                medium: ""
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi" # צמצום זיכרון
        alertmanager:
          enabled: false # לא צריך התראות במחשב האישי
        grafana:
          enabled: true # גרפנה נשארת כדי לראות ויזואלית
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
        # ביטול רכיבים כבדים שרצים על כל ה-Nodes
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # פותר את בעיית ה-CRD הגדול