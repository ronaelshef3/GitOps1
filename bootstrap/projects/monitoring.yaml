apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: universal-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: 25.x.x
    helm:
      values: |
        server:
          retention: 3h
          persistentVolume:
            enabled: false
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"

        nodeExporter:
          enabled: true
          hostNetwork: false
          hostPID: false
          service:
            type: ClusterIP
            hostPort: 0 

        alertmanager:
          enabled: false
        pushgateway:
          enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Validate=false