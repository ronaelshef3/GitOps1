apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x
    helm:
      values: |
        # Prometheus - Minimal Configuration
        prometheus:
          prometheusSpec:
            replicas: 1
            scrapeInterval: "30s"
            storageSpec:
              emptyDir:
                medium: ""
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
        
        # Disable heavy components
        alertmanager:
          enabled: false
        grafana:
          enabled: true
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
          
        # Webhook fixes for local clusters
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  # --- התיקון לשגיאת ה-Schema וה-Diff ---
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jsonPointers:
        - /automountServiceAccountToken
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/automountServiceAccountToken

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # עוקף את מגבלת ה-256KB של ה-CRDs
      - Validate=false      # מתעלם משגיאות Schema ב-Cache
      - Replace=true        # מאפשר דריסה נקייה של משאבים תקועים