apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slim-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x
    helm:
      values: |
        prometheusOperator:
          admissionWebhooks:
            enabled: false
        nodeExporter:
          enabled: false # זה יציל לך את ה-CPU
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            resources:
              limits:
                cpu: 200m
                memory: 1Gi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true