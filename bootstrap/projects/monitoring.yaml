apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.x.x
    helm:
      valueFiles:
        - "https://raw.githubusercontent.com/ronaelshef3/GitOps1/master/infrastructure/monitoring/values.yaml"
      values: |
        prometheus:
          prometheusSpec:
            storageSpec:
              emptyDir:
                medium: ""
            resources:
              requests:
                cpu: "100m"
                memory: "400Mi"
              limits:
                cpu: "500m"
                memory: "800Mi"
        alertmanager:
          enabled: false
        grafana:
          enabled: true
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
          tls:
            enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Validate=false      # מתעלם משגיאות Schema ב-Cache של ArgoCD
      - Replace=true        # מאפשר החלפת משאבים אם ה-Patch נכשל
      - SkipDryRunOnMissingResource=true