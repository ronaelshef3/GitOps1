apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minimal-monitoring
  namespace: argocd
spec:
  project: default
  source:
    # Using the standard Prometheus chart (not the Operator stack)
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: prometheus
    targetRevision: 25.x.x
    helm:
      values: |
        # Disable components you don't need for a "light" version
        alertmanager:
          enabled: false
        pushgateway:
          enabled: false
        
        server:
          # Keep only 6 hours of data to save memory/CPU
          retention: 6h
          # Disable Persistent Volumes to avoid storage issues
          persistentVolume:
            enabled: false
          # Resource requests for a lean footprint
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          # Service configuration
          service:
            type: ClusterIP

        # Scrape metrics from nodes (CPU, RAM, etc.)
        nodeExporter:
          enabled: true

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Skips schema validation during the diff phase to prevent the "field not declared" error
      - Validate=false