apiVersion: apps/v1
kind: Deployment
metadata:
  name: quakewatch
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quakewatch
  template:
    metadata:
      labels:
        app: quakewatch
    spec:
      containers:
      - name: quakewatch
        image: your-image-repo/quakewatch:latest # <--- תחליפי לתמונה שלך ב-DockerHub/ECR
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: quakewatch-service
  namespace: default
  annotations:
    # כאן החיבור לניטור - פשוט ונקי
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: quakewatch
  ports:
  - port: 80
    targetPort: 8080
    name: http