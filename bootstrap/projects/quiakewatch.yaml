apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ronaelshef3/GitOps1.git'
    path: 'app-manifests/quakewatch-chart'
    targetRevision: master
    helm:
      valueFiles:
      - values.yaml
      # אין כאן parameters! כי אין dependencies לכבות. הכל נקי.

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: my-app-namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true