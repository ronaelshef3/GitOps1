apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/ronaelshef3/GitOps1.git'
    path: 'app-manifests/quakewatch-chart'
    targetRevision: master
    helm:
      valueFiles:
      - values.yaml

      # --- זה החלק שהיה חסר לך! ---
      # אנחנו דורסים את ההגדרות ומכבים את הפורט 9100 בכוח
      parameters:
        - name: prometheus.enabled
          value: "false"
        - name: prometheus.server.enabled
          value: "false"
        - name: prometheus.alertmanager.enabled
          value: "false"
        - name: prometheus.nodeExporter.enabled
          value: "false"
        - name: prometheus.pushgateway.enabled
          value: "false"
        - name: redis.metrics.enabled
          value: "false"
      # ----------------------------

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: my-app-namespace

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true